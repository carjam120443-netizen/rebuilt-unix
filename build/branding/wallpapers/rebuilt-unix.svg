      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
