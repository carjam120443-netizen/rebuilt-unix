    <text y="-50" fill="#f8fafc" font-size="104" font-weight="700" letter-spacing="12">REBUILT UNIX</text>
    <text y="35" fill="#93c5fd" font-size="34" letter-spacing="5">A UNIX-STYLE SYSTEM REBUILT OUR WAY</text>
