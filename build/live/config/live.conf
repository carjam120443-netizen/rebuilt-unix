# Rebuilt Unix live environment configuration

LIVE_NAME="Rebuilt Unix Live"
LIVE_MODE="live"
TARGET_ARCH="amd64"

# Keep the live environment reusable by both the main live system
# and the future installer.
ENABLE_INSTALLER="yes"
INSTALLER_PATH="/usr/local/lib/rebuilt-unix/installer"

# Live media should not require an installed target system.
PERSISTENCE="no"

# Temporary runtime filesystem.
LIVE_ROOT="/run/rebuilt-unix-live"
