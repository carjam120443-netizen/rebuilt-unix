# Rebuilt Unix build workspace configuration

# All generated files stay outside the Git repository where possible.
WORK_DIR="${WORK_DIR:-/tmp/rebuilt-unix-build}"
OUTPUT_DIR="${OUTPUT_DIR:-build/output}"

# FreeBSD release mirrors are selected by the builder.
FREEBSD_RELEASE_ROOT="https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE"

# Required release sets for the first bootable image.
RELEASE_SETS="base.txz kernel.txz"

# Do not download or commit binary release sets into the repository.
COMMIT_BINARY_SETS="no"
