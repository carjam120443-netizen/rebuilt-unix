name: Build Rebuilt Unix ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build/**'
      - '.github/workflows/build-iso.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD ISO build
        uses: vmactions/freebsd-vm@v1.3.0
        with:
          release: '15.0'
          usesh: true
          copyback: true
          prepare: |
            pkg update -f
            pkg install -y ca_root_nss curl
          run: |
            set -eu
            chmod +x build/scripts/build-freebsd-iso.sh
            mkdir -p build/output
            build/scripts/build-freebsd-iso.sh 2>&1 | tee build/output/build.log

      - name: Locate and verify generated ISO
        shell: bash
        run: |
          set -eu
          echo '=== Build output ==='
          find build/output -maxdepth 3 -type f -print -exec ls -lh {} \; || true

          echo '=== ISO files returned by FreeBSD VM ==='
          find . -type f -name '*.iso' -print

          ISO="$(find build/output -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo '::error::No ISO was returned from the FreeBSD builder.'
            echo '=== Recent build log ==='
            tail -n 200 build/output/build.log 2>/dev/null || true
            exit 1
          fi

          echo "Found ISO: $ISO"
          test -s "$ISO"
          file "$ISO"

          CHECKSUM="${ISO}.sha256"
          sha256sum "$ISO" > "$CHECKSUM"

          echo "ISO=$ISO" >> "$GITHUB_ENV"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Upload Rebuilt Unix ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-unix-15.1-amd64-iso
          path: |
            ${{ env.ISO }}
            ${{ env.CHECKSUM }}
            build/output/build.log
          if-no-files-found: error
          retention-days: 14
