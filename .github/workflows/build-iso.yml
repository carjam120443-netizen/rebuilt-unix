name: Build Rebuilt Unix ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build/**'
      - '.github/workflows/build-iso.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD ISO build
        uses: vmactions/freebsd-vm@v1.3.0
        with:
          # Quote this value so YAML preserves 15.0.
          # The builder VM is FreeBSD 15.0; the target is FreeBSD 15.1-RELEASE.
          release: '15.0'
          usesh: true
          copyback: true
          prepare: |
            pkg update -f
            pkg install -y ca_root_nss
          run: |
            set -eu
            chmod +x build/scripts/build-freebsd-iso.sh
            mkdir -p build/output
            build/scripts/build-freebsd-iso.sh 2>&1 | tee build/output/build.log

      - name: Verify generated ISO
        shell: bash
        run: |
          set -eu
          test -s build/output/rebuilt-unix-15.1-RELEASE-amd64.iso
          file build/output/rebuilt-unix-15.1-RELEASE-amd64.iso
          sha256sum build/output/rebuilt-unix-15.1-RELEASE-amd64.iso > build/output/rebuilt-unix-15.1-RELEASE-amd64.iso.sha256

      - name: Upload Rebuilt Unix ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-unix-15.1-amd64-iso
          path: |
            build/output/rebuilt-unix-15.1-RELEASE-amd64.iso
            build/output/rebuilt-unix-15.1-RELEASE-amd64.iso.sha256
            build/output/build.log
          if-no-files-found: error
          retention-days: 14
